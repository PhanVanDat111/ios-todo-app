workflows:
  # ─────────────────────────────────────────────
  #  Android Workflow – builds a debug APK
  # ─────────────────────────────────────────────
  android-workflow:
    name: Android Debug APK
    instance_type: linux_x2
    max_build_duration: 30
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Accept Android SDK licenses
        script: |
          yes | sdkmanager --licenses || true
      - name: Flutter analyze
        script: |
          flutter analyze || true
      - name: Build Android APK (debug)
        script: |
          flutter build apk --debug
    artifacts:
      - build/app/outputs/flutter-apk/app-debug.apk
    publishing:
      email:
        recipients:
          - pdat7737@gmail.com
        notify:
          success: true
          failure: true

  # ─────────────────────────────────────────────
  #  iOS FREE Workflow – build IPA không cần
  #  Apple Developer Account ($99)
  #  → Dùng Sideloadly để cài lên iPhone miễn phí
  # ─────────────────────────────────────────────
  ios-free-workflow:
    name: iOS IPA (Free - Sideloadly)
    instance_type: mac_mini_m1
    max_build_duration: 30
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Install CocoaPods dependencies
        script: |
          cd ios && pod install --repo-update
      - name: Flutter analyze
        script: |
          flutter analyze || true
      - name: Build iOS IPA (no codesign)
        script: |
          flutter build ipa --release --no-codesign
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/Runner.xcarchive
    publishing:
      email:
        recipients:
          - pdat7737@gmail.com
        notify:
          success: true
          failure: true

  # ─────────────────────────────────────────────
  #  iOS Workflow – build IPA & upload TestFlight
  #
  #  Trước khi dùng, cần điền vào Codemagic:
  #  1. Environment Variables:
  #     - APP_STORE_CONNECT_KEY_IDENTIFIER  (Key ID)
  #     - APP_STORE_CONNECT_ISSUER_ID       (Issuer ID)
  #     - APP_STORE_CONNECT_PRIVATE_KEY     (nội dung file .p8)
  #     - CERTIFICATE_PRIVATE_KEY           (private key RSA)
  #  Tất cả đánh dấu Secure = ON
  # ─────────────────────────────────────────────
  ios-workflow:
    name: iOS Build & TestFlight
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      # Codemagic tự động quản lý signing khi dùng app_store_connect
      app_store_connect:
        auth: integration
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.example.ios_todo_app
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Install CocoaPods dependencies
        script: |
          cd ios && pod install --repo-update
      - name: Set build number từ Codemagic
        script: |
          BUILD_NUMBER=$PROJECT_BUILD_NUMBER
          agvtool new-version -all $BUILD_NUMBER
      - name: Flutter analyze
        script: |
          flutter analyze || true
      - name: Build iOS IPA (release)
        script: |
          flutter build ipa --release \
            --build-number=$PROJECT_BUILD_NUMBER
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - pdat7737@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        # Upload thẳng lên TestFlight sau khi build xong
        auth: integration
        submit_to_testflight: true
        # Tự động thêm tester (tuỳ chọn)
        beta_groups:
          - "Internal Testers"
